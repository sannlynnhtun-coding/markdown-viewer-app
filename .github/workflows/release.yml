name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v1.4.1

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test MarkdownViewerApp.Tests -c Release

      - name: Publish self-contained Windows app
        run: >-
          dotnet publish MarkdownViewerApp/MarkdownViewerApp.csproj
          -c Release -r win-x64 --self-contained true
          -p:Platform=x64 -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -o artifacts/installer/publish

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          & $compiler scripts/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }

      - name: Verify installer
        shell: pwsh
        run: ./scripts/test-installer.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $env:RELEASE_TAG artifacts/installer/MarkdownViewer.Setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Installer upload failed.' }
